unresolved_questions:
  - id: Q1
    question: What production topology, OS, hosting, service accounts and deployment versions correspond to this repository?
    impact: Source deployment confidence is low; repository behavior cannot prove running-server behavior.
    recommended_probe: Obtain approved redacted deployment/service/IIS/task exports and match deployed artifacts to this revision without connecting to servers.
  - id: Q2
    question: What current SQL Server facts and externally provided Azure SQL Database schema, data, type and role/export contracts apply?
    impact: Data confidence remains low; code adaptation requires the external team's interface contract. Source and target share the SQL Server engine family (superseded from an earlier same-day PostgreSQL selection — see Decisions-Required.md D-04), so engine-rewrite is not assumed, but Azure SQL Database PaaS constraints (no xp_cmdshell, no cross-database queries, no Windows-integrated auth) are not yet validated against this codebase's actual usage.
    recommended_probe: Obtain redacted source metadata and the target team's schema/types/naming/test-fixture/authentication/export contract; no schema/data migration is in this code-only scope.
  - id: Q3
    question: What sign-in, SSO, user population, delegation and role-mapping behavior must be preserved?
    impact: Entra ID is selected for sign-in, but role mapping, delegation and service identity are still unverified.
    recommended_probe: Review role-to-action and principal mappings with the identity owner; document approved sign-in and outbound service-identity choices.
  - id: Q4
    question: Which exact GDPR/UK-GDPR obligations, other regulations, residency, retention, audit and encryption requirements apply?
    impact: GDPR scope is selected, but compliance details remain low confidence and do not establish a permitted region or no audit.
    recommended_probe: Obtain a data-owner/security-approved classification and policy statement before region/storage/retention decisions.
  - id: Q5
    question: Is Azure connectivity VPN or ExpressRoute, and which DNS, routes, ports and firewall policies are usable?
    impact: Network confidence is low; reported connectivity does not establish service reachability or authorization.
    recommended_probe: Obtain the network team's approved connectivity diagram and rule inventory; test endpoints only with explicit consent.
  - id: Q6
    question: What schedules, triggers, timezone, run volumes, durations and overlap rules govern generation and file transfer?
    impact: Batch packaging and replica/concurrency decisions require the real run contract.
    recommended_probe: Obtain task/scheduler exports and run summaries; document noninteractive arguments and concurrency requirements.
  - id: Q7
    question: What RTO, RPO, cutover window, SLA and usable nonproduction environment are required?
    impact: Operational confidence is low; recovery, rollout and acceptance cannot be designed safely.
    recommended_probe: Agree recovery and downtime objectives with operations and confirm an isolated rehearsal environment.
  - id: Q8
    question: Who owns master DOCX templates, fonts, images and their approved packaging/licensing source?
    impact: Present-but-untracked templates cannot support a reproducible clean-checkout image build.
    recommended_probe: Establish a controlled asset inventory, hashes, provenance and approved delivery mechanism without exposing claim documents.
  - id: Q9
    question: Which Linux-compatible PDF, transfer and drawing paths meet approved behavior, licensing and PDF-parity needs?
    impact: Native Windows dependencies block the requested target as-is; no replacement choice is approved.
    recommended_probe: Present lowest-disruption options and run approved isolated golden-document/transfer proofs after architecture decisions.
  - id: Q10
    question: Who is the accountable owner, what is production criticality, and who signs off user/business acceptance?
    impact: Ownership, criticality and acceptance routing must not be guessed.
    recommended_probe: Confirm named business/technical owners, user counts and acceptance criteria.
  - id: Q11
    question: Which Azure region, availability, quotas and budget constraints apply?
    impact: Explicitly deferred outside current code-only scope; candidate services are not validated for deployment.
    recommended_probe: Reopen before any future infrastructure or deployment work; obtain user choices and explicit subscription-scoped consent before Azure queries.
  - id: Q12
    question: What executable NUnit/PDF regression baseline, restore/CI readiness and PdfCompare tooling runtime can be established?
    impact: Tests exist but have not run in discovery; output parity and reproducibility are not certified.
    recommended_probe: Inspect test isolation, then run approved local tests and nonpersonal golden-PDF comparisons; record tooling Node version and dependency reproducibility.

assumptions:
