  primary_framework: aspnet-core-10
  secondary_stacks:
    - nodejs
  build_system: msbuild
  runtime_version_detected: net10.0
  evidence_confidence: high
  evidence_paths:
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\RPA.ClaimStatements.Generator.csproj
    - RPA.ClaimStatements\RPA.ClaimStatements.Web\RPA.ClaimStatements.Web.csproj
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator.Tests\RPA.ClaimStatements.Generator.Tests.csproj
    - RPA.ClaimStatements\RPA.ClaimStatements.Web.Tests\RPA.ClaimStatements.Web.Tests.csproj
    - PdfCompare\package.json
  notes: |
    Current source already targets .NET 10; the older .NET Framework 4.5 scan is
    historical, not the current runtime. Windows-only dependencies remain.
    Node.js is only the standalone PdfCompare development/test utility, not
    the deployed application runtime; its version is unknown (Q12).
    Browser JavaScript is not a separate production Node.js service.
    Approximately 13,615 first-party compiled C# lines across four projects,
    excluding generated designers, excluded duplicates and historical copies.
  secondary_runtime_versions:
    nodejs: unknown
  component_roles:
    - component: Generator
      role: Console generator and shared in-process generation logic.
      runtime: net10.0
    - component: Web
      role: ASP.NET Core MVC administrative UI; references Generator.
      runtime: net10.0
    - component: PdfCompare
      role: Manually invoked PDF text-comparison tooling; npm dependencies.
      runtime: unknown
  adapters:
    - .github\skills\stack-adapters\references\stack-dotnet.md
    - .github\skills\stack-adapters\references\stack-nodejs.md

workload:
  primary_pattern: webapp
  secondary_patterns:
    - batch-job
  entry_points:
    - RPA.ClaimStatements\RPA.ClaimStatements.Web\Program.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Program.cs
    - DAXAPFileTransfer.ps1
  evidence_confidence: high
  evidence_paths:
    - RPA.ClaimStatements\RPA.ClaimStatements.Web\Program.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Program.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Components\PowerPlant.cs
    - DAXAPFileTransfer.ps1
  notes: |
    Web runs Generator logic in-process, not through a queue or a separate
    deployed worker. The generator also has a console entrypoint.
    CLI accepts ALL, BPS, XB, or I and an optional batch size; no-argument
    interactive behavior needs an explicit noninteractive launch contract.
    Machine-scoped named mutexes do not coordinate different replicas.
    Actual production scheduling, run volumes and overlap policy are unknown (Q6).
    Import stages support document generation; no separate ETL platform is inferred.
  adapters:
    - .github\skills\workload-adapters\references\workload-webapp.md
    - .github\skills\workload-adapters\references\workload-batch-job.md

data:
  primary_datastore: sql-server
  datastore_version: unknown
  data_gravity: unknown
  approximate_size: unknown
  schema_highlights:
    - EF6 context and bulk-ingestion paths; SQL Server engine is confirmed by source.
    - Main application database and separate SQL-backed authorization database.
    - Logical SITI, DAX, XB, CS, Log, Monitor, and FDMR schemas.
    - Approximately 26 mapped entities and EF migration history from 2018 through 2021.
    - Standalone cross-border and FDMR SQL assets outside the EF model.
    - FDMR export script invokes xp_cmdshell and BCP on the database host.
    - Production schema drift and migration-history alignment require owner evidence.
  evidence_confidence: low
  evidence_paths:
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Context\ClaimStatementContext.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Context\IClaimStatementsContext.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.Generator\Migrations
    - RPA.ClaimStatements\RPA.ClaimStatements.Web\Security\RoleStore.cs
    - RPA.ClaimStatements\RPA.ClaimStatements.FDMR\LoadExtract.sql
    - modernization-findings.md
  notes: |
    Engine and source schema have high confidence, but production version, size,
    backups, drift and operational ownership are unverified. Q2 is the blocking
    data probe. Unknown data gravity is not a small/medium assumption.
    No database connection, query, migration or script execution was performed.

