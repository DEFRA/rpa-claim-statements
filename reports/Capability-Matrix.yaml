migration_strategy:
  recommendation: refactor
  recommendation_label: "\u26A0 Default guess"
  evidence_confidence: medium
  rationale: |
    User priority is modernize. Current supported .NET stack, approximately
    13,615 compiled first-party C# lines and existing NUnit tests support
    Branch 5 refactoring rather than a ground-up rewrite or decomposition.
    Runtime retargeting is already present; remaining work is compatibility,
    identity, configuration, state, native dependencies and behavioral parity.
    This is a provisional recommendation, not an approved architecture.
    Q1 and Q2 are blocking evidence probes for deployment and data confidence;
    Q4, Q9 and Q12 gate readiness for execution and acceptance.
  decision_path:
    - "Branch 1: no documented sunset or SaaS-only retention case; continue."
    - "Branch 2: inspectable application source exists; no-source rehost does not apply."
    - "Branch 3: .NET is supported; Windows-bound dependencies are target incompatibilities, not an unsupported source family."
    - "Branch 4: speed-first not selected."
    - "Branch 5: modernize, small compiled codebase and tests present; provisional Refactor."
    - "Branches 6 and 7: cost-first and risk-first not selected."
    - "Branch 8: webapp plus batch-job; no forced desktop/vendor/ETL override."
    - "Branch 9: data volume unknown; defer gravity override until Q2; include Database Specialist now."
    - "Branch 10: requested Container Apps is conditional; Jobs requires a separate approved batch boundary."
    - "Branch 11: evaluate Rehost, Rebuild and Replatform rather than assume a rewrite."
    - "Branch 12: named specialists cover app, data, identity, validation, deployment and recovery evidence."
  alternatives_considered:
    - alternative: rehost
      rejected_because: Lowest-disruption fallback, but preserves Windows debt and does not satisfy the requested Container Apps target as-is.
    - alternative: rebuild
      rejected_because: Existing bounded codebase, domain logic, templates and tests support incremental preservation; no rewrite investment or parity scope approved.
    - alternative: replatform
      rejected_because: Hosting-only changes cannot remove native Windows, identity, file-state and concurrency constraints; targeted code refactoring is needed.
  target_azure_candidates:
    - service: Azure Container Apps
      fit: medium
      fit_notes: User-requested candidate; conditional on Linux/native/identity/state remediation and region/quota validation, not deployment-ready.
    - service: Azure Container Apps Jobs
      fit: medium
      fit_notes: Candidate only for an explicitly approved independently packaged batch path; current web invokes generation in-process.
    - service: Azure Virtual Machines
      fit: medium
      fit_notes: Windows-compatible fallback if required dependencies cannot be ported; user approval needed to depart from Container Apps.
  notes: No SKU, region, database, identity, storage, registry, runtime-upgrade or microservice decision has been made.

