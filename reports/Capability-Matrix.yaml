    impact_if_wrong: Reconcile deployment drift before estimating or changing behavior.
  - assumption: Scope is targeted refactoring and preservation, not a microservices rewrite.
    impact_if_wrong: Return to user-owned strategy and architecture decisions.
  - assumption: Reported Azure connectivity can potentially support a transition.
    impact_if_wrong: Network remediation or a different migration sequence will be needed.
  - assumption: Local template assets can be obtained from an approved master source.
    impact_if_wrong: Reproducible packaging and PDF-parity acceptance remain blocked.
  - assumption: Existing test code is reusable after its dependencies and environment are validated.
    impact_if_wrong: Establish missing coverage before behavioral changes.

