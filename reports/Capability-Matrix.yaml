    - RPA.ClaimStatements\RPA.ClaimStatements.Web\Program.cs
    - https://learn.microsoft.com/en-us/azure/container-apps/containers
  constraints:
    - Container Apps requires Linux linux/amd64 images; Windows containers are not supported.
    - System.Drawing.Common and native wkhtmltopdf.exe/WinSCP.exe need an approved Linux-compatible path.
    - Windows-integrated sign-in and outbound integrated-security assumptions need a validated identity path.
    - Machine-scoped generation mutexes cannot protect cross-replica execution.
    - App-relative writable staging is not a durable archive or shared state store.
    - Required DOCX templates exist locally but are ignored and absent from a clean Git checkout.
    - Database-host xp_cmdshell/BCP export must be assessed independently of app hosting.
    - Current PDF/XSLT/templates/fonts/images and output contracts require parity validation.
  notes: These are application compatibility findings, not new canonical risk-flag values or approved replacement choices.

